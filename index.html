<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeCraft Pro — Enterprise Multi-Tool Developer Suite</title>
    <meta name="description" content="Lightning-fast client-side developer platform. Convert JSON to TypeScript, Zod, and Pydantic, generate mock API data, and manage session history instantly.">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <style>
        pre::-webkit-scrollbar, textarea::-webkit-scrollbar { width: 6px; height: 6px; }
        pre::-webkit-scrollbar-track, textarea::-webkit-scrollbar-track { background: rgba(15, 23, 42, 0.6); }
        pre::-webkit-scrollbar-thumb, textarea::-webkit-scrollbar-thumb { background: rgba(99, 102, 241, 0.4); border-radius: 4px; }
        pre::-webkit-scrollbar-thumb:hover, textarea::-webkit-scrollbar-thumb:hover { background: rgba(99, 102, 241, 0.7); }
    </style>
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white" @keydown.window.ctrl.enter="generate()">

    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white font-bold flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
                </div>
                <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent">TypeCraft<span class="text-indigo-500">.pro</span></span>
            </div>
            
            <!-- Tool Mode Switcher Hub -->
            <div class="flex bg-slate-900 p-1 border border-slate-800 rounded-xl" x-data>
                <button @click="activeTool = 'synth'" :class="activeTool === 'synth' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">Synthesizer</button>
                <button @click="activeTool = 'mock'" :class="activeTool === 'mock' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">Mock Data</button>
            </div>
        </div>
    </header>

    <!-- Top Leaderboard Ad Slot (Policy compliant placement) -->
    <div class="w-full bg-slate-900/30 border-b border-slate-900 py-3">
        <div class="max-w-7xl mx-auto px-4 flex justify-center">
            <div class="w-full max-w-[728px] h-[90px] bg-slate-900/80 border border-dashed border-slate-800 rounded-lg flex items-center justify-center text-xs text-slate-600 uppercase tracking-widest select-none">
                <span>Advertisement (Leaderboard 728x90)</span>
            </div>
        </div>
    </div>

    <!-- Main Workspace App Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-12 gap-8" x-data="typeCraftApp()">
        
        <!-- Left Workspace Column (Span 9) -->
        <div class="lg:col-span-9 flex flex-col space-y-6">
            
            <!-- Tool 1: Schema Synthesizer View -->
            <template x-if="activeTool === 'synth'">
                <div class="flex flex-col space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                        <div>
                            <h1 class="text-2xl font-extrabold tracking-tight text-white">Advanced Code & Schema Synthesizer</h1>
                            <p class="text-sm text-slate-400 mt-0.5">Convert JSON into TypeScript, Zod, or Pydantic. Press <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-xs">Ctrl + Enter</kbd> to run.</p>
                        </div>
                        <div class="flex bg-slate-900 p-1 border border-slate-800 rounded-xl self-start">
                            <button @click="setLang('ts')" :class="lang === 'ts' ? 'bg-indigo-600 text-white' : 'text-slate-400'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">TS</button>
                            <button @click="setLang('zod')" :class="lang === 'zod' ? 'bg-indigo-600 text-white' : 'text-slate-400'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">Zod</button>
                            <button @click="setLang('pydantic')" :class="lang === 'pydantic' ? 'bg-indigo-600 text-white' : 'text-slate-400'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">Pydantic</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 h-[580px]">
                        <!-- Input -->
                        <div class="flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
                            <div class="bg-slate-800/60 px-4 py-2.5 border-b border-slate-800 flex items-center justify-between text-xs">
                                <span class="font-semibold text-slate-300 uppercase tracking-wider">Input JSON</span>
                                <div class="space-x-2">
                                    <button @click="formatJsonInput()" class="text-slate-400 hover:text-slate-200">Format</button>
                                    <span>|</span>
                                    <button @click="loadSample()" class="text-indigo-400 font-medium">Sample</button>
                                    <span>|</span>
                                    <button @click="inputJson = ''; generate();" class="text-slate-400">Clear</button>
                                </div>
                            </div>
                            <textarea x-model="inputJson" @input="generate()" placeholder="Paste JSON payload..." class="w-full flex-grow bg-transparent p-4 font-mono text-xs sm:text-sm text-slate-200 focus:outline-none resize-none"></textarea>
                            <div class="bg-slate-950/60 px-4 py-2 border-t border-slate-800 flex justify-between items-center text-xs">
                                <span x-text="errorMsg ? errorMsg : '✓ Valid JSON'" :class="errorMsg ? 'text-rose-400' : 'text-emerald-400'"></span>
                                <span class="text-slate-500" x-text="inputJson.length + ' chars'"></span>
                            </div>
                        </div>

                        <!-- Output -->
                        <div class="flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-2xl relative">
                            <div class="bg-slate-800/60 px-4 py-2.5 border-b border-slate-800 flex items-center justify-between text-xs">
                                <span class="font-semibold text-slate-300 uppercase tracking-wider" x-text="outputHeaderTitle"></span>
                                <button @click="copyOutput()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded font-medium transition" x-text="copied ? 'Copied!' : 'Copy Code'"></button>
                            </div>
                            <pre class="w-full flex-grow bg-transparent p-4 font-mono text-xs sm:text-sm text-indigo-200 overflow-auto select-all"><code x-text="outputCode"></code></pre>
                            <div class="bg-slate-950/60 px-4 py-2 border-t border-slate-800 flex justify-between items-center text-xs text-slate-500">
                                <span>Client-side execution</span>
                                <span x-text="outputCode.split('\n').length + ' lines'"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Tool 2: Mock API Data Generator View -->
            <template x-if="activeTool === 'mock'">
                <div class="flex flex-col space-y-6">
                    <div>
                        <h1 class="text-2xl font-extrabold tracking-tight text-white">Mock API Payload Generator</h1>
                        <p class="text-sm text-slate-400 mt-0.5">Generate realistic test data rows instantly from any schema structure.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 h-[580px]">
                        <div class="flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
                            <div class="bg-slate-800/60 px-4 py-2.5 border-b border-slate-800 text-xs font-semibold text-slate-300 uppercase tracking-wider">Base Template JSON</div>
                            <textarea x-model="mockInput" class="w-full flex-grow bg-transparent p-4 font-mono text-xs sm:text-sm text-slate-200 focus:outline-none resize-none"></textarea>
                            <div class="p-3 bg-slate-950/60 border-t border-slate-800 flex items-center justify-between">
                                <span class="text-xs text-slate-400">Rows: <strong x-text="mockRows" class="text-white"></strong></span>
                                <input type="range" min="1" max="20" x-model="mockRows" class="accent-indigo-600">
                                <button @click="generateMock()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-1.5 rounded font-semibold">Generate Mock Data</button>
                            </div>
                        </div>

                        <div class="flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
                            <div class="bg-slate-800/60 px-4 py-2.5 border-b border-slate-800 text-xs font-semibold text-slate-300 uppercase tracking-wider flex justify-between">
                                <span>Generated Mock Dataset</span>
                                <button @click="navigator.clipboard.writeText(mockOutput)" class="text-indigo-400 hover:underline">Copy JSON</button>
                            </div>
                            <pre class="w-full flex-grow bg-transparent p-4 font-mono text-xs sm:text-sm text-emerald-300 overflow-auto select-all"><code x-text="mockOutput"></code></pre>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Configuration & History Toolbar -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col space-y-3">
                <div class="flex flex-wrap items-center justify-between gap-4">
                    <div class="flex items-center space-x-6 text-sm">
                        <label class="flex items-center space-x-2 cursor-pointer">
                            <input type="checkbox" x-model="options.optionalFields" @change="generate()" class="rounded bg-slate-800 border-slate-700 text-indigo-600">
                            <span class="text-slate-300 text-xs">Optional Fields (?)</span>
                        </label>
                        <div class="flex items-center space-x-2">
                            <span class="text-xs text-slate-400">Root Name:</span>
                            <input type="text" x-model="options.rootName" @input="generate()" class="bg-slate-950 border border-slate-800 rounded px-2.5 py-1 text-xs text-slate-200 focus:outline-none w-28">
                        </div>
                    </div>
                    <div class="text-xs text-slate-400">
                        History: <strong class="text-indigo-400" x-text="history.length"></strong> items
                    </div>
                </div>

                <!-- Interactive History Dropdown Chips -->
                <template x-if="history.length > 0">
                    <div class="border-t border-slate-800 pt-3 flex flex-wrap gap-2 items-center">
                        <span class="text-[11px] text-slate-500 uppercase tracking-wider">Recent:</span>
                        <template x-for="(item, index) in history" :key="index">
                            <button @click="inputJson = item.fullJson; generate();" 
                                    class="bg-slate-950 hover:bg-slate-800 border border-slate-800 text-slate-300 text-xs px-2.5 py-1 rounded-md transition truncate max-w-[180px]"
                                    :title="item.fullJson">
                                <span x-text="item.date + ' — ' + item.snippet"></span>
                            </button>
                        </template>
                    </div>
                </template>
            </div>

        </div>

        <!-- Right Sidebar Ad Column (Span 3) -->
        <aside class="lg:col-span-3 flex flex-col space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col items-center justify-center min-h-[300px] text-center sticky top-24">
                <span class="text-[10px] text-slate-600 uppercase tracking-widest mb-3">Sponsored Content</span>
                <!-- AdSense Vertical/Box Slot: 300x250 -->
                <div class="w-full h-[250px] bg-slate-950/60 border border-dashed border-slate-800 rounded-lg flex items-center justify-center text-xs text-slate-600">
                    <span>AdSense Sidebar Slot (300x250)</span>
                </div>
                <p class="text-[11px] text-slate-500 mt-3">Ads support free developer tools.</p>
            </div>
        </aside>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-slate-950 py-8 mt-auto text-center text-xs text-slate-600">
        <p>&copy; 2026 TypeCraft Pro. Enterprise Multi-Tool Suite Edition.</p>
    </footer>

    <!-- Core Engine & Application State Logic -->
    <script>
        function typeCraftApp() {
            return {
                activeTool: 'synth',
                inputJson: '',
                outputCode: '// Paste or load JSON to begin...',
                errorMsg: '',
                copied: false,
                lang: 'ts',
                options: { optionalFields: false, rootName: 'RootObject' },
                history: JSON.parse(localStorage.getItem('tc_history') || '[]'),
                
                mockInput: '{\n  "id": 1,\n  "name": "Jane Doe",\n  "isActive": true\n}',
                mockRows: 5,
                mockOutput: '// Click generate mock data...',

                get outputHeaderTitle() {
                    if (this.lang === 'ts') return 'TypeScript Interfaces';
                    if (this.lang === 'zod') return 'Zod Schema';
                    if (this.lang === 'pydantic') return 'Python Pydantic Models';
                    return 'Output';
                },

                setLang(l) { this.lang = l; this.generate(); },

                loadSample() {
                    const sample = {
                        "id": 4092,
                        "account": "enterprise_user",
                        "verified": true,
                        "permissions": ["read", "write", "execute"],
                        "billing": { "tier": "pro", "balanceDue": 0.00 }
                    };
                    this.inputJson = JSON.stringify(sample, null, 2);
                    this.generate();
                },

                formatJsonInput() {
                    if (!this.inputJson.trim()) return;
                    try {
                        const parsed = JSON.parse(this.inputJson);
                        this.inputJson = JSON.stringify(parsed, null, 2);
                        this.errorMsg = '';
                        this.generate();
                    } catch (e) { this.errorMsg = 'Formatting failed: Invalid JSON'; }
                },

                generate() {
                    this.errorMsg = '';
                    if (!this.inputJson.trim()) {
                        this.outputCode = '// Paste or load JSON to begin...';
                        return;
                    }
                    try {
                        const parsed = JSON.parse(this.inputJson);
                        const rootName = (this.options.rootName && this.options.rootName.trim()) ? this.options.rootName.trim() : 'RootObject';
                        const registries = {};
                        
                        if (this.lang === 'ts') {
                            this.parseTS(parsed, rootName, registries);
                            let res = '';
                            for (const name in registries) { res += `interface ${name} {\n${registries[name]}\n}\n\n`; }
                            this.outputCode = res.trim();
                        } else if (this.lang === 'zod') {
                            this.parseZod(parsed, rootName, registries);
                            let res = `import { z } from 'zod';\n\n`;
                            for (const name in registries) { res += `export const ${name} = z.object({\n${registries[name]}\n});\n\n`; }
                            this.outputCode = res.trim();
                        } else if (this.lang === 'pydantic') {
                            this.parsePydantic(parsed, rootName, registries);
                            let res = `from pydantic import BaseModel\nfrom typing import List, Optional, Any\n\n`;
                            for (const name in registries) { res += `class ${name}(BaseModel):\n${registries[name]}\n\n`; }
                            this.outputCode = res.trim();
                        }

                        // Save history with full payload retention
                        this.history.unshift({ 
                            date: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }), 
                            snippet: this.inputJson.slice(0, 15) + '...',
                            fullJson: this.inputJson
                        });
                        if (this.history.length > 5) this.history.pop();
                        localStorage.setItem('tc_history', JSON.stringify(this.history));
                    } catch (e) {
                        this.errorMsg = 'JSON Error: ' + e.message;
                        this.outputCode = '// Fix syntax errors to update schema';
                    }
                },

                parseTS(val, name, registries) {
                    if (val === null || val === undefined) return 'any;';
                    if (Array.isArray(val)) {
                        if (val.length === 0) return 'any[];';
                        const first = val[0];
                        if (typeof first === 'object' && first !== null && !Array.isArray(first)) {
                            const childName = this.singularize(name);
                            this.parseTS(first, childName, registries);
                            return `${childName}[];`;
                        }
                        return `${typeof first}[];`;
                    }
                    if (typeof val === 'object') {
                        const lines = [];
                        const opt = this.options.optionalFields ? '?' : '';
                        for (const key in val) {
                            const sub = val[key];
                            const safeKey = /^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(key) ? key : `'${key}'`;
                            if (sub === null || sub === undefined) {
                                lines.push(`  ${safeKey}${opt}: any;`);
                            } else if (Array.isArray(sub)) {
                                if (sub.length > 0 && typeof sub[0] === 'object' && sub[0] !== null) {
                                    const childName = this.capitalize(key);
                                    this.parseTS(sub[0], childName, registries);
                                    lines.push(`  ${safeKey}${opt}: ${childName}[];`);
                                } else {
                                    const stype = sub.length > 0 ? typeof sub[0] : 'any';
                                    lines.push(`  ${safeKey}${opt}: ${stype}[];`);
                                }
                            } else if (typeof sub === 'object') {
                                const childName = this.capitalize(key);
                                this.parseTS(sub, childName, registries);
                                lines.push(`  ${safeKey}${opt}: ${childName};`);
                            } else {
                                lines.push(`  ${safeKey}${opt}: ${typeof sub};`);
                            }
                        }
                        registries[name] = lines.join('\n');
                        return name;
                    }
                    return `${typeof val};`;
                },

                parseZod(val, name, registries) {
                    if (val === null || val === undefined) return 'z.any()';
                    if (Array.isArray(val)) {
                        if (val.length === 0) return 'z.array(z.any())';
                        const first = val[0];
                        if (typeof first === 'object' && first !== null && !Array.isArray(first)) {
                            const childName = this.singularize(name);
                            this.parseZod(first, childName, registries);
                            return `z.array(${childName})`;
                        }
                        return `z.array(z.${typeof first}())`;
                    }
                    if (typeof val === 'object') {
                        const lines = [];
                        const optSuffix = this.options.optionalFields ? '.optional()' : '';
                        for (const key in val) {
                            const sub = val[key];
                            const safeKey = /^[a-zA-Z_$][a-zA-Z0-9_$]*$/.test(key) ? key : `'${key}'`;
                            if (sub === null || sub === undefined) {
                                lines.push(`  ${safeKey}: z.any()${optSuffix},`);
                            } else if (Array.isArray(sub)) {
                                if (sub.length > 0 && typeof sub[0] === 'object' && sub[0] !== null) {
                                    const childName = this.capitalize(key);
                                    this.parseZod(sub[0], childName, registries);
                                    lines.push(`  ${safeKey}: z.array(${childName})${optSuffix},`);
                                } else {
                                    const stype = sub.length > 0 ? typeof sub[0] : 'string';
                                    lines.push(`  ${safeKey}: z.array(z.${stype}())${optSuffix},`);
                                }
                            } else if (typeof sub === 'object') {
                                const childName = this.capitalize(key);
                                this.parseZod(sub, childName, registries);
                                lines.push(`  ${safeKey}: ${childName}${optSuffix},`);
                            } else {
                                lines.push(`  ${safeKey}: z.${typeof sub}()${optSuffix},`);
                            }
                        }
                        registries[name] = lines.join('\n');
                        return name;
                    }
                    return `z.${typeof val}()`;
                },

                parsePydantic(val, name, registries) {
                    if (val === null || val === undefined) return 'Any';
                    if (Array.isArray(val)) {
                        if (val.length === 0) return 'List[Any]';
                        const first = val[0];
                        if (typeof first === 'object' && first !== null && !Array.isArray(first)) {
                            const childName = this.singularize(name);
                            this.parsePydantic(first, childName, registries);
                            return `List[${childName}]`;
                        }
                        const pyType = typeof first === 'number' ? (Number.isInteger(first) ? 'int' : 'float') : (typeof first === 'boolean' ? 'bool' : 'str');
                        return `List[${pyType}]`;
                    }
                    if (typeof val === 'object') {
                        const lines = [];
                        for (const key in val) {
                            const sub = val[key];
                            const safeKey = /^[a-zA-Z_][a-zA-Z0-9_]*$/.test(key) ? key : `field_${key}`;
                            const opt = this.options.optionalFields;
                            if (sub === null || sub === undefined) {
                                lines.push(`    ${safeKey}: ${opt ? 'Optional[Any] = None' : 'Any'}`);
                            } else if (Array.isArray(sub)) {
                                if (sub.length > 0 && typeof sub[0] === 'object' && sub[0] !== null) {
                                    const childName = this.capitalize(key);
                                    this.parsePydantic(sub[0], childName, registries);
                                    lines.push(`    ${safeKey}: ${opt ? `Optional[List[${childName}]] = None` : `List[${childName}]`}`);
                                } else {
                                    const stype = sub.length > 0 ? (typeof sub[0] === 'number' ? (Number.isInteger(sub[0]) ? 'int' : 'float' ) : (typeof sub[0] === 'boolean' ? 'bool' : 'str')) : 'Any';
                                    lines.push(`    ${safeKey}: ${opt ? `Optional[List[${stype}]] = None` : `List[${stype}]`}`);
                                }
                            } else if (typeof sub === 'object') {
                                const childName = this.capitalize(key);
                                this.parsePydantic(sub, childName, registries);
                                lines.push(`    ${safeKey}: ${opt ? `Optional[${childName}] = None` : childName}`);
                            } else {
                                const t = typeof sub === 'number' ? (Number.isInteger(sub) ? 'int' : 'float') : (typeof sub === 'boolean' ? 'bool' : 'str');
                                lines.push(`    ${safeKey}: ${opt ? `Optional[${t}] = None` : t}`);
                            }
                        }
                        registries[name] = lines.join('\n');
                        return name;
                    }
                    return 'Any';
                },

                capitalize(str) {
                    const cleaned = str.replace(/[^a-zA-Z0-9_$]/g, '');
                    return cleaned ? cleaned.charAt(0).toUpperCase() + cleaned.slice(1) : 'Item';
                },

                singularize(str) {
                    const cap = this.capitalize(str);
                    if (cap.endsWith('ies')) return cap.slice(0, -3) + 'y';
                    if (cap.endsWith('s') && !cap.endsWith('ss')) return cap.slice(0, -1);
                    return cap + 'Item';
                },

                generateMock() {
                    try {
                        const template = JSON.parse(this.mockInput);
                        const result = [];
                        for (let i = 1; i <= this.mockRows; i++) {
                            const row = {};
                            for (const key in template) {
                                if (typeof template[key] === 'number') row[key] = template[key] + i;
                                else if (typeof template[key] === 'string') row[key] = `${template[key]}_${i}`;
                                else row[key] = template[key];
                            }
                            result.push(row);
                        }
                        this.mockOutput = JSON.stringify(result, null, 2);
                    } catch (e) {
                        this.mockOutput = '// Error: Invalid JSON template syntax';
                    }
                },

                copyOutput() {
                    navigator.clipboard.writeText(this.outputCode);
                    this.copied = true;
                    setTimeout(() => this.copied = false, 2000);
                }
            }
        }
    </script>

<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>TypeCraft Pro — Enterprise Multi-Tool Developer Suite</title>
    <meta name="description" content="Lightning-fast client-side developer platform. Convert JSON to TypeScript, Zod, and Pydantic, generate mock API data, and diff schemas instantly.">
    
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['Inter', 'sans-serif'],
                        mono: ['JetBrains Mono', 'monospace'],
                    }
                }
            }
        }
    </script>
    
    <!-- Alpine.js -->
    <script defer src="https://cdn.jsdelivr.net/npm/alpinejs@3.x.x/dist/cdn.min.js"></script>
    
    <!-- Google Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    
    <link rel="stylesheet" href="./assets/css/style.css">
</head>
<body class="bg-slate-950 text-slate-100 font-sans antialiased min-h-screen flex flex-col selection:bg-indigo-500 selection:text-white" @keydown.window.ctrl.enter="generate()">

    <!-- Header Navigation -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <div class="flex items-center space-x-3">
                <div class="bg-indigo-600 p-2 rounded-lg text-white font-bold flex items-center justify-center shadow-lg shadow-indigo-500/30">
                    <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 20l4-16m4 4l4 4-4 4M6 16l-4-4 4-4"/></svg>
                </div>
                <span class="text-xl font-bold tracking-tight bg-gradient-to-r from-white via-slate-200 to-indigo-400 bg-clip-text text-transparent">TypeCraft<span class="text-indigo-500">.pro</span></span>
            </div>
            
            <!-- Tool Mode Switcher Hub -->
            <div class="hidden md:flex bg-slate-900 p-1 border border-slate-800 rounded-xl">
                <button @click="activeTool = 'synth'" :class="activeTool === 'synth' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">Schema Synthesizer</button>
                <button @click="activeTool = 'mock'" :class="activeTool === 'mock' ? 'bg-indigo-600 text-white shadow' : 'text-slate-400 hover:text-white'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">Mock Data Generator</button>
            </div>
        </div>
    </header>

    <!-- Top Leaderboard Ad Slot -->
    <div class="w-full bg-slate-900/30 border-b border-slate-900 py-3">
        <div class="max-w-7xl mx-auto px-4 flex justify-center">
            <div class="w-full max-w-[728px] h-[90px] bg-slate-900/80 border border-dashed border-slate-800 rounded-lg flex items-center justify-center text-xs text-slate-600 uppercase tracking-widest select-none">
                <span>Advertisement (Leaderboard 728x90)</span>
            </div>
        </div>
    </div>

    <!-- Main Workspace App Container -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 py-8 flex-grow w-full grid grid-cols-1 lg:grid-cols-12 gap-8" x-data="typeCraftApp()">
        
        <!-- Left Workspace Column (Span 9) -->
        <div class="lg:col-span-9 flex flex-col space-y-6">
            
            <!-- Tool 1: Schema Synthesizer View -->
            <template x-if="activeTool === 'synth'">
                <div class="flex flex-col space-y-6">
                    <div class="flex flex-col sm:flex-row sm:items-center sm:justify-between gap-4">
                        <div>
                            <h1 class="text-2xl font-extrabold tracking-tight text-white">Advanced Code & Schema Synthesizer</h1>
                            <p class="text-sm text-slate-400 mt-0.5">Convert JSON into TypeScript, Zod, or Pydantic models. Press <kbd class="px-1.5 py-0.5 bg-slate-800 border border-slate-700 rounded text-xs">Ctrl + Enter</kbd> to run.</p>
                        </div>
                        <div class="flex bg-slate-900 p-1 border border-slate-800 rounded-xl self-start">
                            <button @click="setLang('ts')" :class="lang === 'ts' ? 'bg-indigo-600 text-white' : 'text-slate-400'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">TS</button>
                            <button @click="setLang('zod')" :class="lang === 'zod' ? 'bg-indigo-600 text-white' : 'text-slate-400'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">Zod</button>
                            <button @click="setLang('pydantic')" :class="lang === 'pydantic' ? 'bg-indigo-600 text-white' : 'text-slate-400'" class="px-3 py-1.5 rounded-lg text-xs font-semibold transition">Pydantic</button>
                        </div>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 h-[580px]">
                        <!-- Input -->
                        <div class="flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
                            <div class="bg-slate-800/60 px-4 py-2.5 border-b border-slate-800 flex items-center justify-between text-xs">
                                <span class="font-semibold text-slate-300 uppercase tracking-wider">Input JSON</span>
                                <div class="space-x-2">
                                    <button @click="formatJsonInput()" class="text-slate-400 hover:text-slate-200">Format</button>
                                    <span>|</span>
                                    <button @click="loadSample()" class="text-indigo-400 font-medium">Sample</button>
                                    <span>|</span>
                                    <button @click="inputJson = ''; generate();" class="text-slate-400">Clear</button>
                                </div>
                            </div>
                            <textarea x-model="inputJson" @input="generate()" placeholder="Paste JSON payload..." class="w-full flex-grow bg-transparent p-4 font-mono text-xs sm:text-sm text-slate-200 focus:outline-none resize-none"></textarea>
                            <div class="bg-slate-950/60 px-4 py-2 border-t border-slate-800 flex justify-between items-center text-xs">
                                <span x-text="errorMsg ? errorMsg : '✓ Valid JSON'" :class="errorMsg ? 'text-rose-400' : 'text-emerald-400'"></span>
                                <span class="text-slate-500" x-text="inputJson.length + ' chars'"></span>
                            </div>
                        </div>

                        <!-- Output -->
                        <div class="flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-2xl relative">
                            <div class="bg-slate-800/60 px-4 py-2.5 border-b border-slate-800 flex items-center justify-between text-xs">
                                <span class="font-semibold text-slate-300 uppercase tracking-wider" x-text="outputHeaderTitle"></span>
                                <button @click="copyOutput()" class="bg-indigo-600 hover:bg-indigo-500 text-white px-3 py-1 rounded font-medium transition" x-text="copied ? 'Copied!' : 'Copy Code'"></button>
                            </div>
                            <pre class="w-full flex-grow bg-transparent p-4 font-mono text-xs sm:text-sm text-indigo-200 overflow-auto select-all"><code x-text="outputCode"></code></pre>
                            <div class="bg-slate-950/60 px-4 py-2 border-t border-slate-800 flex justify-between items-center text-xs text-slate-500">
                                <span>Client-side execution</span>
                                <span x-text="outputCode.split('\n').length + ' lines'"></span>
                            </div>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Tool 2: Mock API Data Generator View -->
            <template x-if="activeTool === 'mock'">
                <div class="flex flex-col space-y-6">
                    <div>
                        <h1 class="text-2xl font-extrabold tracking-tight text-white">Mock API Payload Generator</h1>
                        <p class="text-sm text-slate-400 mt-0.5">Generate realistic test data rows instantly from any schema structure.</p>
                    </div>

                    <div class="grid grid-cols-1 md:grid-cols-2 gap-4 h-[580px]">
                        <div class="flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
                            <div class="bg-slate-800/60 px-4 py-2.5 border-b border-slate-800 text-xs font-semibold text-slate-300 uppercase tracking-wider">Base Template JSON</div>
                            <textarea x-model="mockInput" class="w-full flex-grow bg-transparent p-4 font-mono text-xs sm:text-sm text-slate-200 focus:outline-none resize-none"></textarea>
                            <div class="p-3 bg-slate-950/60 border-t border-slate-800 flex items-center justify-between">
                                <span class="text-xs text-slate-400">Rows: <strong x-text="mockRows" class="text-white"></strong></span>
                                <input type="range" min="1" max="20" x-model="mockRows" class="accent-indigo-600">
                                <button @click="generateMock()" class="bg-indigo-600 hover:bg-indigo-500 text-white text-xs px-4 py-1.5 rounded font-semibold">Generate Mock Data</button>
                            </div>
                        </div>

                        <div class="flex flex-col bg-slate-900 border border-slate-800 rounded-xl overflow-hidden shadow-2xl">
                            <div class="bg-slate-800/60 px-4 py-2.5 border-b border-slate-800 text-xs font-semibold text-slate-300 uppercase tracking-wider flex justify-between">
                                <span>Generated Mock Dataset</span>
                                <button @click="navigator.clipboard.writeText(mockOutput)" class="text-indigo-400 hover:underline">Copy JSON</button>
                            </div>
                            <pre class="w-full flex-grow bg-transparent p-4 font-mono text-xs sm:text-sm text-emerald-300 overflow-auto select-all"><code x-text="mockOutput"></code></pre>
                        </div>
                    </div>
                </div>
            </template>

            <!-- Configuration Toolbar -->
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-wrap items-center justify-between gap-4">
                <div class="flex items-center space-x-6 text-sm">
                    <label class="flex items-center space-x-2 cursor-pointer">
                        <input type="checkbox" x-model="options.optionalFields" @change="generate()" class="rounded bg-slate-800 border-slate-700 text-indigo-600">
                        <span class="text-slate-300 text-xs">Optional Fields (?)</span>
                    </label>
                    <div class="flex items-center space-x-2">
                        <span class="text-xs text-slate-400">Root Name:</span>
                        <input type="text" x-model="options.rootName" @input="generate()" class="bg-slate-950 border border-slate-800 rounded px-2.5 py-1 text-xs text-slate-200 focus:outline-none w-28">
                    </div>
                </div>
                <div class="text-xs text-slate-500">History: <span x-text="history.length"></span> items stored</div>
            </div>

        </div>

        <!-- Right Sidebar Ad Column (Span 3) -->
        <aside class="lg:col-span-3 flex flex-col space-y-6">
            <div class="bg-slate-900 border border-slate-800 rounded-xl p-4 flex flex-col items-center justify-center min-h-[300px] text-center sticky top-24">
                <span class="text-[10px] text-slate-600 uppercase tracking-widest mb-3">Sponsored Content</span>
                <div class="w-full h-[250px] bg-slate-950/60 border border-dashed border-slate-800 rounded-lg flex items-center justify-center text-xs text-slate-600">
                    <span>AdSense Sidebar Slot (300x250)</span>
                </div>
                <p class="text-[11px] text-slate-500 mt-3">Ads support free developer tools.</p>
            </div>
        </aside>

    </main>

    <!-- Footer -->
    <footer class="border-t border-slate-900 bg-slate-950 py-8 mt-auto text-center text-xs text-slate-600">
        <p>&copy; 2026 TypeCraft Pro. Modular Enterprise Edition.</p>
    </footer>

    <!-- Load Modular JavaScript Files -->
    <script src="./assets/js/engines.js"></script>
    <script src="./assets/js/app.js"></script>
</body>
    </html>
